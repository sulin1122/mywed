<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <!-- 设置网页字符编码 -->
    <meta charset="UTF-8">

    <!-- 让网页适应手机、平板和电脑 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 浏览器标签页的小图标 -->
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="icon" href="./images/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="./images/logo.svg" type="image/svg+xml" sizes="any">


    <!-- 浏览器标签页标题 -->
    <title>我的待办清单｜苏林的 JavaScript 网页练习</title>
    <meta name="description" content="苏林的 JavaScript 待办清单练习，支持添加任务、标记完成、删除任务和统计剩余事项。">
    <meta name="author" content="苏林">
    <link rel="canonical" href="https://sulin1122.github.io/1.html">

    <style>

        /* 清除浏览器默认的部分内外边距 */
        * {
            box-sizing: border-box; /* 宽度和高度包含内边距、边框 */
        }

        /* 设置整个页面 */
        body {
            margin: 0; /* 清除页面默认外边距 */
            font-family: Arial, sans-serif; /* 设置字体 */
            background-color: #f2f5f8; /* 设置页面背景颜色 */
            color: #333; /* 设置默认文字颜色 */
        }

        /* 设置网站头部 */
        header {
            background-color: #2c3e50; /* 设置头部背景颜色 */
            padding: 15px 20px; /* 设置头部上下和左右内边距 */
        }

        /* 设置导航栏 */
        nav {
            display: flex; /* 开启 Flex 布局 */
            justify-content: center; /* 让导航链接水平居中 */
            align-items: center; /* 让导航链接垂直居中 */
            gap: 25px; /* 设置导航链接之间的距离 */
            flex-wrap: wrap; /* 空间不足时允许换行 */
        }

        /* 设置导航栏链接 */
        nav a {
            color: white; /* 设置链接文字颜色 */
            text-decoration: none; /* 去掉链接下划线 */
            font-size: 16px; /* 设置文字大小 */
            padding: 8px 12px; /* 设置链接内边距 */
            border-radius: 5px; /* 设置圆角 */
        }

        /* 设置第一个网站名称链接 */
        nav a:first-child {
            font-size: 20px; /* 设置网站名称文字大小 */
            font-weight: bold; /* 设置文字加粗 */
            margin-right: 30px; /* 设置右侧距离 */
        }

        /* 鼠标移动到导航链接上时 */
        nav a:hover {
            background-color: #3498db; /* 改变链接背景颜色 */
        }

        /* 待办清单最外层区域 */
        .todo-container {
            width: 90%; /* 设置容器宽度 */
            max-width: 600px; /* 设置容器最大宽度 */
            margin: 40px auto; /* 设置上下外边距，并让容器水平居中 */
            padding: 30px; /* 设置容器内边距 */
            background-color: white; /* 设置容器背景颜色 */
            border-radius: 12px; /* 设置容器圆角 */
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12); /* 设置容器阴影 */
        }

        /* 设置待办清单标题 */
        #header {
            margin-top: 0; /* 清除标题顶部外边距 */
            text-align: center; /* 让标题文字居中 */
            color: #2c3e50; /* 设置标题文字颜色 */
        }

        /* 输入框和添加按钮所在区域 */
        .input-area {
            display: flex; /* 开启 Flex 布局 */
            gap: 10px; /* 设置输入框和按钮之间的距离 */
            margin-bottom: 20px; /* 设置区域底部外边距 */
        }

        /* 设置待办事项输入框 */
        #todoInput {
            flex: 1; /* 让输入框占据剩余空间 */
            min-width: 0; /* 防止输入框在小屏幕中超出容器 */
            padding: 12px; /* 设置输入框内边距 */
            border: 1px solid #cccccc; /* 设置输入框边框 */
            border-radius: 6px; /* 设置输入框圆角 */
            font-size: 16px; /* 设置输入框文字大小 */
            outline: none; /* 去掉点击输入框时的默认轮廓 */
        }

        /* 点击待办事项输入框时 */
        #todoInput:focus {
            border-color: #3498db; /* 改变输入框边框颜色 */
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.4); /* 添加蓝色阴影 */
        }

        /* 添加按钮 */
        #addButton {
            padding: 12px 20px; /* 设置按钮内边距 */
            border: none; /* 去掉按钮边框 */
            border-radius: 6px; /* 设置按钮圆角 */
            background-color: #3498db; /* 设置按钮背景颜色 */
            color: white; /* 设置按钮文字颜色 */
            font-size: 16px; /* 设置按钮文字大小 */
            cursor: pointer; /* 鼠标移动到按钮上时显示小手 */
        }

        /* 鼠标移动到添加按钮上时 */
        #addButton:hover {
            background-color: #2980b9; /* 改变按钮背景颜色 */
        }

        /* 待办事项列表 */
        #todoList {
            padding: 0; /* 清除列表默认内边距 */
            margin: 0; /* 清除列表默认外边距 */
            list-style: none; /* 去掉列表前面的圆点 */
        }

        /* 每一条待办事项 */
        .todo-item {
            display: flex; /* 开启 Flex 布局 */
            align-items: center; /* 让内容垂直居中 */
            gap: 10px; /* 设置内容之间的距离 */
            padding: 12px; /* 设置待办事项内边距 */
            margin-bottom: 10px; /* 设置待办事项底部距离 */
            background-color: #f7f9fa; /* 设置待办事项背景颜色 */
            border: 1px solid #e1e4e8; /* 设置待办事项边框 */
            border-radius: 6px; /* 设置待办事项圆角 */
        }

        /* 设置复选框 */
        .todo-checkbox {
            width: 20px; /* 设置复选框宽度 */
            height: 20px; /* 设置复选框高度 */
            cursor: pointer; /* 鼠标移动到复选框时显示小手 */
        }

        /* 设置待办事项文字 */
        .todo-text {
            flex: 1; /* 让文字占据剩余空间 */
            word-break: break-all; /* 文字太长时自动换行 */
        }

        /* 待办事项完成后的文字样式 */
        .completed .todo-text {
            color: #999; /* 设置完成后的文字颜色 */
            text-decoration: line-through; /* 给完成的文字添加删除线 */
        }

        /* 删除按钮 */
        .delete-button {
            padding: 7px 12px; /* 设置按钮内边距 */
            border: none; /* 去掉按钮边框 */
            border-radius: 5px; /* 设置按钮圆角 */
            background-color: #e74c3c; /* 设置按钮背景颜色 */
            color: white; /* 设置按钮文字颜色 */
            cursor: pointer; /* 鼠标移动到按钮上时显示小手 */
        }

        /* 鼠标移动到删除按钮上时 */
        .delete-button:hover {
            background-color: #c0392b; /* 改变删除按钮背景颜色 */
        }

        /* 清单底部区域 */
        .todo-footer {
            display: flex; /* 开启 Flex 布局 */
            justify-content: space-between; /* 让统计文字和按钮分别位于两侧 */
            align-items: center; /* 让内容垂直居中 */
            gap: 15px; /* 设置内容之间的距离 */
            margin-top: 20px; /* 设置顶部外边距 */
        }

        /* 剩余任务数量文字 */
        #todoCount {
            color: #666; /* 设置文字颜色 */
            font-size: 15px; /* 设置文字大小 */
        }

        /* 清空全部按钮 */
        #clearButton {
            padding: 10px 16px; /* 设置按钮内边距 */
            border: none; /* 去掉按钮边框 */
            border-radius: 6px; /* 设置按钮圆角 */
            background-color: #7f8c8d; /* 设置按钮背景颜色 */
            color: white; /* 设置按钮文字颜色 */
            cursor: pointer; /* 鼠标移动到按钮上时显示小手 */
        }

        /* 鼠标移动到清空按钮上时 */
        #clearButton:hover {
            background-color: #626e70; /* 改变按钮背景颜色 */
        }

        /* 没有待办事项时显示的提示文字 */
        #emptyMessage {
            text-align: center; /* 让提示文字居中 */
            color: #999; /* 设置提示文字颜色 */
            padding: 20px 0; /* 设置提示文字上下内边距 */
        }

        /* 手机屏幕适配 */
        @media screen and (max-width: 480px) {

            /* 修改导航栏方向 */
            nav {
                gap: 8px; /* 减少导航链接之间的距离 */
            }

            /* 修改网站名称链接 */
            nav a:first-child {
                width: 100%; /* 让网站名称独占一行 */
                margin-right: 0; /* 清除右侧外边距 */
                text-align: center; /* 让网站名称居中 */
            }

            /* 修改清单容器 */
            .todo-container {
                margin: 25px auto; /* 减少容器上下外边距 */
                padding: 20px; /* 减少容器内边距 */
            }

            /* 修改输入区域 */
            .input-area {
                flex-direction: column; /* 让输入框和按钮上下排列 */
            }

            /* 修改底部区域 */
            .todo-footer {
                flex-direction: column; /* 让统计文字和清空按钮上下排列 */
            }

            /* 修改清空按钮 */
            #clearButton {
                width: 100%; /* 让清空按钮占满一行 */
            }
        }

    </style>

</head>

<body>

    <!-- 网站顶部区域 -->
    <header>

        <!-- 导航栏 -->
        <nav aria-label="待办清单导航">
            <a href="./index.html">苏林的个人网站</a>
            <a href="#header">待办清单</a>
            <a href="./index.html#works">网页作品</a>
            <a href="./index.html#contact">联系与交流</a>
        </nav>

    </header>

    <!-- 待办清单主体区域 -->
    <main class="todo-container">

        <!-- 待办清单标题 -->
        <h1 id="header">我的待办清单</h1>

        <!-- 输入框和添加按钮 -->
        <div class="input-area">

            <!-- 输入待办事项的输入框 -->
            <input type="text" id="todoInput" placeholder="例如：完成今天的 HTML 练习" aria-label="新的待办事项"
              maxlength="100">

            <!-- 点击按钮添加待办事项 -->
            <button type="button" id="addButton">添加</button>

        </div>
  

        <!-- 没有任务时显示的提示 -->
        <p id="emptyMessage">暂时没有待办事项</p>

        <!-- 待办事项会通过 JavaScript 添加到这里 -->
        <ul id="todoList"></ul>

        <!-- 待办清单底部区域 -->
        <div class="todo-footer">

            <!-- 显示剩余未完成任务数量 -->
            <span id="todoCount">剩余 0 项</span>

            <!-- 点击按钮清空所有待办事项 -->
            <button type="button" id="clearButton">清空全部</button>

        </div>

    </main>

    <script>

        // 找到待办事项输入框
        const todoInput = document.getElementById("todoInput");

        // 找到添加按钮
        const addButton = document.getElementById("addButton");

        // 找到待办事项列表
        const todoList = document.getElementById("todoList");

        // 找到清空全部按钮
        const clearButton = document.getElementById("clearButton");

        // 找到剩余任务数量文字
        const todoCount = document.getElementById("todoCount");

        // 找到没有任务时的提示文字
        const emptyMessage = document.getElementById("emptyMessage");


        // 创建添加待办事项的函数
        function addTodo() {

            // 获取输入框中的内容，并使用 trim() 去掉前后空格
            const todoText = todoInput.value.trim();

            // 判断输入框是否为空
            if (todoText === "") {

                // 输入框为空时弹出提示
                alert("请输入待办事项！");

                // 让光标回到输入框
                todoInput.focus();

                // 停止继续执行函数
                return;
            }

            // 创建一个新的 li 列表项目
            const todoItem = document.createElement("li");

            // 给 li 添加 todo-item 类名
            todoItem.className = "todo-item";


            // 创建一个复选框
            const checkbox = document.createElement("input");

            // 设置 input 的类型为 checkbox
            checkbox.type = "checkbox";

            // 给复选框添加类名
            checkbox.className = "todo-checkbox";
            checkbox.setAttribute("aria-label", "标记完成：" + todoText);


            // 创建一个 span，用来显示待办事项文字
            const textSpan = document.createElement("span");

            // 给 span 添加类名
            textSpan.className = "todo-text";

            // 把用户输入的内容放进 span
            textSpan.textContent = todoText;


            // 创建删除按钮
            const deleteButton = document.createElement("button");

            // 设置按钮类型
            deleteButton.type = "button";

            // 设置删除按钮上的文字
            deleteButton.textContent = "删除";
            deleteButton.setAttribute("aria-label", "删除任务：" + todoText);

            // 给删除按钮添加类名
            deleteButton.className = "delete-button";


            // 把复选框添加到 li 中
            todoItem.appendChild(checkbox);

            // 把待办事项文字添加到 li 中
            todoItem.appendChild(textSpan);

            // 把删除按钮添加到 li 中
            todoItem.appendChild(deleteButton);

            // 把完整的 li 添加到待办事项列表中
            todoList.appendChild(todoItem);


            // 监听复选框的变化
            checkbox.addEventListener("change", function () {

                // 根据复选框状态添加或者移除 completed 类名
                todoItem.classList.toggle("completed", checkbox.checked);

                // 更新剩余任务数量
                updateTodoCount();
            });


            // 监听删除按钮的点击事件
            deleteButton.addEventListener("click", function () {

                // 从列表中删除当前待办事项
                todoItem.remove();

                // 更新剩余任务数量
                updateTodoCount();
            });


            // 清空输入框
            todoInput.value = "";

            // 让光标回到输入框
            todoInput.focus();

            // 更新剩余任务数量
            updateTodoCount();
        }


        // 创建更新剩余任务数量的函数
        function updateTodoCount() {

            // 找到所有没有被勾选的复选框
            const unfinishedTodos = todoList.querySelectorAll(
                ".todo-checkbox:not(:checked)"
            );

            // 找到当前所有待办事项
            const allTodos = todoList.querySelectorAll(".todo-item");

            // 显示剩余未完成任务的数量
            todoCount.textContent = "剩余 " + unfinishedTodos.length + " 项";

            // 如果没有待办事项，就显示提示文字
            if (allTodos.length === 0) {
                emptyMessage.style.display = "block";
            } else {
                emptyMessage.style.display = "none";
            }
        }


        // 点击添加按钮时执行 addTodo 函数
        addButton.addEventListener("click", addTodo);


        // 监听输入框的键盘按键
        todoInput.addEventListener("keydown", function (event) {

            // 判断用户按下的是否是回车键
            if (event.key === "Enter") {

                // 执行添加待办事项函数
                addTodo();
            }
        });


        // 点击清空全部按钮时
        clearButton.addEventListener("click", function () {

            // 判断当前是否没有待办事项
            if (todoList.children.length === 0) {

                // 没有待办事项时显示提示
                alert("当前没有可以清空的待办事项！");

                // 停止继续执行
                return;
            }

            // 弹出确认窗口，防止误操作
            const confirmClear = confirm("确定要清空全部待办事项吗？");

            // 如果用户点击“确定”
            if (confirmClear) {

                // 清空列表中的所有内容
                todoList.innerHTML = "";

                // 更新剩余任务数量和提示文字
                updateTodoCount();
            }
        });


        // 页面打开时先更新一次任务数量
        updateTodoCount();

    </script>

</body>

</html>
